<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zentrix Tech Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6c63ff;
            --secondary: #ff3cac;
            --accent: #00d4ff;
            --dark: #0a0a1a;
            --darker: #050510;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --gradient-1: linear-gradient(135deg, #6c63ff, #ff3cac);
            --gradient-2: linear-gradient(135deg, #00d4ff, #6c63ff);
            --gradient-3: linear-gradient(135deg, #ff3cac, #ff6b35);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--darker);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: var(--darker);
            overflow: hidden;
        }

        .bg-animated::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(108, 99, 255, 0.15), transparent 70%);
            top: -100px;
            left: -100px;
            animation: float1 8s ease-in-out infinite;
        }

        .bg-animated::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 60, 172, 0.12), transparent 70%);
            bottom: -100px;
            right: -100px;
            animation: float2 10s ease-in-out infinite;
        }

        .bg-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: float3 12s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 80px) scale(1.1); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-60px, -40px) scale(1.15); }
        }

        @keyframes float3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-45%, -55%) scale(1.2); }
        }

        /* Grid lines */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(108, 99, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(108, 99, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ===== GLASSMORPHISM CARD ===== */
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            transition: all 0.4s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(108, 99, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.15);
        }

        /* ===== NAVBAR ===== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 16px 0;
            background: rgba(5, 5, 16, 0.8);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        nav.scrolled {
            padding: 12px 0;
            background: rgba(5, 5, 16, 0.95);
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        /* SVG Logo Recreation */
        .logo-icon {
            width: 44px;
            height: 44px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-text .brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #c8b8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .logo-text .tagline-small {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 8px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
            background: rgba(108, 99, 255, 0.15);
        }

        .nav-cta {
            background: var(--gradient-1) !important;
            color: white !important;
            padding: 10px 24px !important;
            border-radius: 12px !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
        }

        .nav-cta:hover {
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.6) !important;
            transform: translateY(-2px);
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 5px;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 2px;
            background: white;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        /* ===== HERO SECTION ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 30px 80px;
            position: relative;
            overflow: hidden;
        }

        .hero-container {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .hero-content {
            animation: slideInLeft 1s ease-out;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(108, 99, 255, 0.15);
            border: 1px solid rgba(108, 99, 255, 0.3);
            border-radius: 50px;
            font-size: 13px;
            color: #a89fff;
            margin-bottom: 28px;
            font-weight: 500;
        }

        .hero-badge span {
            width: 8px;
            height: 8px;
            background: #6c63ff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(42px, 5vw, 72px);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 24px;
        }

        .hero h1 .gradient-text {
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero h1 .gradient-text-2 {
            background: var(--gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-desc {
            font-size: 17px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 40px;
            max-width: 520px;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            padding: 16px 36px;
            background: var(--gradient-1);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 30px rgba(108, 99, 255, 0.4);
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(108, 99, 255, 0.6);
        }

        .btn-secondary {
            padding: 16px 36px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-secondary:hover {
            border-color: rgba(108, 99, 255, 0.5);
            background: rgba(108, 99, 255, 0.1);
            transform: translateY(-3px);
        }

        .hero-stats {
            display: flex;
            gap: 40px;
            margin-top: 50px;
        }

        .stat {
            text-align: left;
        }

        .stat .number {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat .label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 3D Hero Visual */
        .hero-visual {
            animation: slideInRight 1s ease-out;
            position: relative;
        }

        .hero-3d-scene {
            position: relative;
            width: 100%;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-card-main {
            position: absolute;
            width: 320px;
            height: 200px;
            background: rgba(108, 99, 255, 0.1);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(108, 99, 255, 0.3);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 30px 80px rgba(108, 99, 255, 0.3);
            animation: floatMain 4s ease-in-out infinite;
            z-index: 3;
        }

        .floating-card-main .big-icon {
            font-size: 56px;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .floating-card-main p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        @keyframes floatMain {
            0%, 100% { transform: translateY(0) rotateX(5deg) rotateY(-5deg); }
            50% { transform: translateY(-20px) rotateX(-5deg) rotateY(5deg); }
        }

        .floating-mini {
            position: absolute;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .floating-mini .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .card-1 { top: 50px; left: -20px; animation: floatCard1 5s ease-in-out infinite; }
        .card-2 { bottom: 60px; left: -10px; animation: floatCard2 6s ease-in-out infinite; }
        .card-3 { top: 40px; right: -30px; animation: floatCard3 4.5s ease-in-out infinite; }
        .card-4 { bottom: 40px; right: -20px; animation: floatCard4 5.5s ease-in-out infinite; }

        @keyframes floatCard1 { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-15px) rotate(2deg); } }
        @keyframes floatCard2 { 0%, 100% { transform: translateY(0) rotate(2deg); } 50% { transform: translateY(-10px) rotate(-3deg); } }
        @keyframes floatCard3 { 0%, 100% { transform: translateY(0) rotate(3deg); } 50% { transform: translateY(-18px) rotate(-2deg); } }
        @keyframes floatCard4 { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(4deg); } }

        /* Circle decorations */
        .hero-circle-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 1px solid rgba(108, 99, 255, 0.15);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: rotateSlow 20s linear infinite;
        }

        .hero-circle-2 {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 60, 172, 0.1);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: rotateSlow 30s linear infinite reverse;
        }

        @keyframes rotateSlow {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ===== SECTION STYLES ===== */
        section {
            padding: 100px 30px;
        }

        .section-container {
            max-width: 1280px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 70px;
        }

        .section-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(108, 99, 255, 0.1);
            border: 1px solid rgba(108, 99, 255, 0.2);
            border-radius: 50px;
            font-size: 12px;
            color: #a89fff;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(32px, 4vw, 52px);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .section-desc {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 560px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* ===== SERVICES SECTION ===== */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .service-card {
            padding: 40px 32px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 24px 24px 0 0;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .s1::before { background: var(--gradient-1); }
        .s2::before { background: var(--gradient-2); }
        .s3::before { background: var(--gradient-3); }
        .s4::before { background: linear-gradient(135deg, #00d4ff, #00ff88); }
        .s5::before { background: linear-gradient(135deg, #ff6b35, #ff3cac); }
        .s6::before { background: linear-gradient(135deg, #a855f7, #6c63ff); }

        .service-icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 24px;
            position: relative;
        }

        .s1 .service-icon-wrap { background: linear-gradient(135deg, rgba(108, 99, 255, 0.2), rgba(255, 60, 172, 0.2)); color: #a89fff; }
        .s2 .service-icon-wrap { background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(108, 99, 255, 0.2)); color: #00d4ff; }
        .s3 .service-icon-wrap { background: linear-gradient(135deg, rgba(255, 60, 172, 0.2), rgba(255, 107, 53, 0.2)); color: #ff6b9d; }
        .s4 .service-icon-wrap { background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 255, 136, 0.2)); color: #00ff88; }
        .s5 .service-icon-wrap { background: linear-gradient(135deg, rgba(255, 107, 53, 0.2), rgba(255, 60, 172, 0.2)); color: #ff6b35; }
        .s6 .service-icon-wrap { background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(108, 99, 255, 0.2)); color: #a855f7; }

        .service-card h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .service-card p {
